<%
# Input parameters
drone_namespace        = @settings["drone_namespace"]
simulation_config_file = @settings["simulation_config_file"]
base_launch            = @settings["base_launch"] == "true"
%>

name: <%= drone_namespace %>
attach: false
root: ./
startup_window: mission_monitoring
pre_window: |
  export AS2_EXTRA_DRONE_MODELS=$AS2_EXTRA_DRONE_MODELS:'x500_px4'

windows:
  # Platform
  - platform:
      layout: tiled
      panes:

      # Drone bridges: gz <-> ros2. Platform gazebo launches drone_bridges in its launchfile
      - ros2 launch as2_gazebo_assets launch_simulation.py
        use_sim_time:=true
        simulation_config_file:=<%= simulation_config_file %>

      - ros2 launch as2_gazebo_assets drone_bridges.py
        namespace:=<%= drone_namespace %>
        simulation_config_file:=<%= simulation_config_file %>

      - sleep 4; cd /root/PX4-Autopilot && PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_NAME=<%= drone_namespace %> PX4_UXRCE_DDS_NS=<%= drone_namespace %> ./build/px4_sitl_default/bin/px4 -i 0
      - MicroXRCEAgent udp4 -p 8888

      - ros2 launch as2_platform_pixhawk pixhawk_launch.py
          namespace:=<%= drone_namespace %>
          platform_config_file:=config/config.yaml

  # Basic Robotics Functions
  - basics_robotics_functions:
      layout:
      panes:
        # State Estimation
        - ros2 launch as2_state_estimator state_estimator_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
        # Motion Controller
        - ros2 launch as2_motion_controller controller_launch.py
            namespace:=<%= drone_namespace %> 
            config_file:=config/config.yaml 
            plugin_name:=pid_speed_controller 
            plugin_config_file:=config/pid_speed_controller.yaml

  # Behaviors
  - behaviors:
      layout:
      panes:
        # Motion
        - ros2 launch as2_behaviors_motion motion_behaviors_launch.py 
            namespace:=<%= drone_namespace %> 
            config_file:=config/config.yaml
        # Precision Landing
        - ros2 launch as2_behaviors_motion precision_landing_behavior_launch.py 
            namespace:=<%= drone_namespace %> 
            plugin_name:=precision_landing_plugin_align_land
        # Perception
        - sleep 3; ros2 launch as2_behaviors_perception detect_aruco_markers_behavior_tf_only_launch.py
            tf_config_file:=$AEROSTACK2_PATH/as2_behaviors/as2_behaviors_perception/detect_aruco_markers_behavior/config/ariel_static_transforms.yaml

        - ros2 launch as2_behaviors_perception detect_aruco_markers_behavior_sim_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
            camera_image_topic:=/<%= drone_namespace %>/sensor_measurements/hd_camera/image_raw
            camera_info_topic:=/<%= drone_namespace %>/sensor_measurements/hd_camera/camera_info

  # Mission execution
  - mission_execution:
      layout:
      panes:
        # Behavior tree
        - ros2 launch as2_behavior_tree behavior_trees.launch.py
            drone_id:=<%= drone_namespace %>
            use_sim_time:=true
            groot_logger:=true
            tree:=./trees/landing_precision.xml
        # Detect ArUco markers
        - |
         sleep 10
         ros2 action send_goal /x500_px4/detect_aruco_markers_behavior \
           as2_msgs/action/DetectArucoMarkers \
           '{target_ids: [6, 7, 8, 9, 17, 18, 19, 28, 29, 38, 39, 48, 49, 58, 59, 68, 69, 78, 79, 102, 103, 104, 105, 107, 108, 109, 117, 118, 119, 128, 129, 138, 139, 148, 149, 158, 159, 168, 169, 178, 202, 203, 204, 205, 207, 209, 217, 219, 229, 239, 249, 259, 269, 279, 302, 303, 304, 305, 309, 319, 329, 339, 349, 359, 369, 402, 403, 404, 405, 502, 503, 504, 505, 602, 603, 604, 605, 702, 703, 704, 705, 802, 803, 804, 805, 902, 903, 904, 905]}'
        # Detect ArUco markers
        - rviz2 -d /root/sim/src/project_ariel_remastered/config/tf.rviz #ros2 run groot Groot --mode monitor

  # Mission monitoring
  - mission_monitoring:
      layout: tiled
      panes:
        - ros2 run as2_alphanumeric_viewer as2_alphanumeric_viewer_node
            --ros-args -r  __ns:=/<%= drone_namespace %>
  # User
  - user:
      layout: tiled
      panes:
        - sleep 1; #ros2 topic pub /x500_px4/start std_msgs/msg/String data:\ \'\'
        - sleep 1; 